<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 50 50" width="50" height="50">
  <style>
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes glow {
      0%, 100% { opacity: 0.6; }
      50% { opacity: 1; }
    }
    .ring {
      transform-origin: 25px 25px;
      animation: spin 10s linear infinite 1.5s, glow 3s ease-in-out infinite 1.5s;
    }
  </style>
  <circle cx="25" cy="25" r="22" fill="#121212" stroke="#d4c5b9" stroke-width="1.5" />
  <circle class="ring" cx="25" cy="25" r="22" fill="none" stroke="#e6ca9c" stroke-width="1.5" stroke-dasharray="8 6" />
  <text x="25" y="29" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#f3eee3" text-anchor="middle">2026</text>
</svg>
