<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 160" width="280" height="160" fill="none">
  <defs>
    <!-- Background Glow -->
    <radialGradient id="card-glow" cx="50%" cy="100%" r="80%">
      <stop offset="0%" stop-color="#e6ca9c" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#e6ca9c" stop-opacity="0" />
    </radialGradient>
    <!-- Border Gradient -->
    <linearGradient id="border-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e6ca9c" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#d4c5b9" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#e6ca9c" stop-opacity="0.8" />
    </linearGradient>
  </defs>

  <style>
    @keyframes float-pill {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-3px); }
    }
    @keyframes border-pulse {
      0%, 100% { stroke-opacity: 0.4; }
      50% { stroke-opacity: 0.9; }
    }
    .card-bg {
      fill: #0d0c10;
    }
    .card-border {
      stroke: url(#border-grad);
      stroke-width: 1.5;
      animation: border-pulse 4s ease-in-out infinite;
    }
    .pill-net {
      animation: float-pill 3s ease-in-out infinite 0.1s;
    }
    .pill-git {
      animation: float-pill 3s ease-in-out infinite 0.3s;
    }
    .pill-vscode {
      animation: float-pill 3s ease-in-out infinite 0.5s;
    }
    .pill-django {
      animation: float-pill 3s ease-in-out infinite 0.7s;
    }
    .pill-pytest {
      animation: float-pill 3s ease-in-out infinite 0.9s;
    }
  </style>

  <!-- Card Body -->
  <rect class="card-bg" x="1" y="1" width="278" height="158" rx="14" />
  <rect x="1" y="1" width="278" height="158" rx="14" fill="url(#card-glow)" />
  <rect class="card-border" x="1" y="1" width="278" height="158" rx="14" />

  <!-- Section Title -->
  <text x="24" y="34" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="bold" fill="#e6ca9c" letter-spacing="1.5">HERRAMIENTAS</text>
  
  <!-- Wrench Pixel Art -->
  <g transform="translate(230, 18)" stroke="#e6ca9c" stroke-width="1.5" stroke-linecap="round" fill="none">
    <circle cx="10" cy="5" r="4.5" />
    <path d="M 8,2 L 12,8" />
    <line x1="13" y1="8.5" x2="19.5" y2="15" stroke-width="2" />
    <rect x="18" y="14" width="2" height="2" fill="#e6ca9c" />
  </g>

  <!-- Tiny pixel separator -->
  <line x1="24" y1="44" x2="256" y2="44" stroke="#d4c5b9" stroke-opacity="0.15" stroke-dasharray="2 2" stroke-width="2" />

  <!-- .NET Pill -->
  <g class="pill-net">
    <g transform="translate(24, 60)">
      <rect x="0" y="0" width="60" height="28" rx="14" fill="#1c1917" stroke="#e6ca9c" stroke-width="1" />
      <text x="30" y="18" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#f3eee3" text-anchor="middle">.NET</text>
    </g>
  </g>

  <!-- Git Pill -->
  <g class="pill-git">
    <g transform="translate(92, 60)">
      <rect x="0" y="0" width="52" height="28" rx="14" fill="#1c1917" stroke="#e6ca9c" stroke-width="1" />
      <text x="26" y="18" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#f3eee3" text-anchor="middle">Git</text>
    </g>
  </g>

  <!-- VS Code Pill -->
  <g class="pill-vscode">
    <g transform="translate(152, 60)">
      <rect x="0" y="0" width="85" height="28" rx="14" fill="#1c1917" stroke="#e6ca9c" stroke-width="1" />
      <text x="42.5" y="18" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#f3eee3" text-anchor="middle">VS Code</text>
    </g>
  </g>

  <!-- Django Pill -->
  <g class="pill-django">
    <g transform="translate(24, 98)">
      <rect x="0" y="0" width="80" height="28" rx="14" fill="#1c1917" stroke="#e6ca9c" stroke-width="1" />
      <text x="40" y="18" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#f3eee3" text-anchor="middle">Django</text>
    </g>
  </g>

  <!-- Pytest Pill -->
  <g class="pill-pytest">
    <g transform="translate(112, 98)">
      <rect x="0" y="0" width="75" height="28" rx="14" fill="#1c1917" stroke="#e6ca9c" stroke-width="1" />
      <text x="37.5" y="18" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#f3eee3" text-anchor="middle">Pytest</text>
    </g>
  </g>

  <!-- Extra tools context -->
  <text x="24" y="142" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" fill="#a39e93">Entornos y Frameworks Modernos</text>
</svg>
