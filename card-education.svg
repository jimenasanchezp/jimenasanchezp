<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 160" width="280" height="160" fill="none">
  <defs>
    <!-- Background Glow -->
    <radialGradient id="card-glow" cx="50%" cy="100%" r="80%">
      <stop offset="0%" stop-color="#e6ca9c" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#e6ca9c" stop-opacity="0" />
    </radialGradient>
    <!-- Border Gradient -->
    <linearGradient id="border-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e6ca9c" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#d4c5b9" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#e6ca9c" stop-opacity="0.8" />
    </linearGradient>
  </defs>

  <style>
    @keyframes float-pill {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-3px); }
    }
    @keyframes border-pulse {
      0%, 100% { stroke-opacity: 0.4; }
      50% { stroke-opacity: 0.9; }
    }
    .card-bg {
      fill: #0d0c10;
    }
    .card-border {
      stroke: url(#border-grad);
      stroke-width: 1.5;
      animation: border-pulse 4s ease-in-out infinite;
    }
    .pill-informatics {
      animation: float-pill 3s ease-in-out infinite 0.2s;
    }
    .pill-algorithms {
      animation: float-pill 3s ease-in-out infinite 0.4s;
    }
    .pill-databases {
      animation: float-pill 3s ease-in-out infinite 0.6s;
    }
    .pill-oop {
      animation: float-pill 3s ease-in-out infinite 0.8s;
    }
  </style>

  <!-- Card Body -->
  <rect class="card-bg" x="1" y="1" width="278" height="158" rx="14" />
  <rect x="1" y="1" width="278" height="158" rx="14" fill="url(#card-glow)" />
  <rect class="card-border" x="1" y="1" width="278" height="158" rx="14" />

  <!-- Section Title -->
  <text x="24" y="34" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="bold" fill="#e6ca9c" letter-spacing="1.5">EDUCACIÓN</text>
  
  <!-- Graduation Cap Pixel Art -->
  <g transform="translate(230, 18)">
    <path d="M 0,5 L 10,0 L 20,5 L 10,10 Z" fill="#e6ca9c" />
    <path d="M 5,7.5 L 5,12 A 5,5 0 0 0 15,12 L 15,7.5" stroke="#e6ca9c" stroke-width="1.5" fill="none" />
    <line x1="18.5" y1="5.5" x2="18.5" y2="13" stroke="#d4c5b9" stroke-width="1" />
    <rect x="17.5" y="12" width="2" height="2" fill="#d4c5b9" />
  </g>

  <!-- Tiny pixel separator -->
  <line x1="24" y1="44" x2="256" y2="44" stroke="#d4c5b9" stroke-opacity="0.15" stroke-dasharray="2 2" stroke-width="2" />

  <!-- Informatics Pill -->
  <g class="pill-informatics">
    <g transform="translate(24, 60)">
      <rect x="0" y="0" width="120" height="28" rx="14" fill="#1c1917" stroke="#e6ca9c" stroke-width="1" />
      <text x="60" y="18" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#f3eee3" text-anchor="middle">Informatics Eng.</text>
    </g>
  </g>

  <!-- Algorithms Pill -->
  <g class="pill-algorithms">
    <g transform="translate(152, 60)">
      <rect x="0" y="0" width="104" height="28" rx="14" fill="#1c1917" stroke="#e6ca9c" stroke-width="1" />
      <text x="52" y="18" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#f3eee3" text-anchor="middle">Algorithms</text>
    </g>
  </g>

  <!-- Databases Pill -->
  <g class="pill-databases">
    <g transform="translate(24, 98)">
      <rect x="0" y="0" width="110" height="28" rx="14" fill="#1c1917" stroke="#e6ca9c" stroke-width="1" />
      <text x="55" y="18" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#f3eee3" text-anchor="middle">Databases &amp; SQL</text>
    </g>
  </g>

  <!-- OOP Pill -->
  <g class="pill-oop">
    <g transform="translate(142, 98)">
      <rect x="0" y="0" width="70" height="28" rx="14" fill="#1c1917" stroke="#e6ca9c" stroke-width="1" />
      <text x="35" y="18" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#f3eee3" text-anchor="middle">OOP / C#</text>
    </g>
  </g>

  <!-- Extra academic context -->
  <text x="24" y="142" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" fill="#a39e93">Universidad de Informática</text>
</svg>
