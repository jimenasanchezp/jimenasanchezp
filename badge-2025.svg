<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 50 50" width="50" height="50" fill="none">
  <style>
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.04); }
    }
    .badge-group {
      transform-origin: 25px 25px;
      animation: pulse 3s ease-in-out infinite;
    }
    .ring {
      transform-origin: 25px 25px;
      animation: spin 15s linear infinite;
    }
  </style>
  
  <g class="badge-group">
    <!-- Pixel Octagon Background -->
    <path d="M 12,2 L 38,2 L 48,12 L 48,38 L 38,48 L 12,48 L 2,38 L 2,12 Z" fill="#1c1917" stroke="#d4c5b9" stroke-width="1.5" />
    
    <!-- Spinning Inner Pattern -->
    <path class="ring" d="M 14,4 L 36,4 L 46,14 L 46,36 L 36,46 L 14,46 L 4,36 L 4,14 Z" fill="none" stroke="#e6ca9c" stroke-width="1" stroke-dasharray="5 3" />
    
    <!-- Small corner pixel dots -->
    <rect x="6" y="6" width="2" height="2" fill="#e6ca9c" />
    <rect x="42" y="6" width="2" height="2" fill="#e6ca9c" />
    <rect x="6" y="42" width="2" height="2" fill="#e6ca9c" />
    <rect x="42" y="42" width="2" height="2" fill="#e6ca9c" />

    <!-- Text -->
    <text x="25" y="29" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#f3eee3" text-anchor="middle">2025</text>
  </g>
</svg>
