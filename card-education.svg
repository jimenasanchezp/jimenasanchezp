<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 160" width="280" height="160">
  <rect x="1" y="1" width="278" height="158" rx="12" fill="#0d0c10" stroke="#f472b6" stroke-width="1" stroke-opacity="0.3" />
  
  <text x="24" y="38" font-family="'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="bold" fill="#ffffff">Education</text>
  
  <!-- Informatics Pill -->
  <g transform="translate(24, 60)">
