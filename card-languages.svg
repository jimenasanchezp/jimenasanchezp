<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 160" width="280" height="160" fill="none">
  <!-- CSS Animations & Styles -->
  <style>
    @keyframes float-csharp {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-3px); }
    }
    @keyframes float-python {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-3px); }
    }
    .pill-csharp {
      animation: float-csharp 3s ease-in-out infinite;
    }
    .pill-python {
      animation: float-python 3s ease-in-out infinite 0.7s;
    }
  </style>

  <!-- Outer Bevel Shell (Win95 style dialog box) -->
  <rect x="0" y="0" width="280" height="160" fill="#f5e6e3" />
  
  <!-- Outer Bevel Border -->
  <line x1="0" y1="0" x2="280" y2="0" stroke="#ffffff" stroke-width="2" />
  <line x1="0" y1="0" x2="0" y2="160" stroke="#ffffff" stroke-width="2" />
  <line x1="0" y1="159" x2="280" y2="159" stroke="#4a3e3c" stroke-width="2" />
  <line x1="279" y1="0" x2="279" y2="160" stroke="#4a3e3c" stroke-width="2" />
  <line x1="1" y1="158" x2="279" y2="158" stroke="#8a7673" stroke-width="1" />
  <line x1="278" y1="1" x2="278" y2="159" stroke="#8a7673" stroke-width="1" />

  <!-- Title Bar -->
  <linearGradient id="title-grad" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#ff758f" />
    <stop offset="100%" stop-color="#ffb3c1" />
  </linearGradient>
  <rect x="4" y="4" width="272" height="18" fill="url(#title-grad)" />
  <text x="10" y="17" font-family="'MS Sans Serif', Arial, sans-serif" font-size="9" font-weight="bold" fill="#ffffff">Languages.dll</text>

  <!-- Close [X] button -->
  <g transform="translate(260, 8)">
    <rect x="0" y="0" width="12" height="10" fill="#f5e6e3" />
    <line x1="0" y1="0" x2="12" y2="0" stroke="#ffffff" stroke-width="0.8" />
    <line x1="0" y1="0" x2="0" y2="10" stroke="#ffffff" stroke-width="0.8" />
    <line x1="0" y1="9" x2="12" y2="9" stroke="#4a3e3c" stroke-width="0.8" />
    <line x1="11" y1="0" x2="11" y2="10" stroke="#4a3e3c" stroke-width="0.8" />
    <path d="M 3,2 L 9,8 M 9,2 L 3,8" stroke="#000000" stroke-width="1" />
  </g>

  <!-- C# Pill (Floating Beveled Button) -->
  <g class="pill-csharp">
    <g transform="translate(16, 40)">
      <!-- Button Base with Bevel -->
      <rect x="0" y="0" width="115" height="34" fill="#fff5f5" />
      <line x1="0" y1="0" x2="115" y2="0" stroke="#ffffff" stroke-width="1.5" />
      <line x1="0" y1="0" x2="0" y2="34" stroke="#ffffff" stroke-width="1.5" />
      <line x1="0" y1="33" x2="115" y2="33" stroke="#4a3e3c" stroke-width="1.5" />
      <line x1="114" y1="0" x2="114" y2="34" stroke="#4a3e3c" stroke-width="1.5" />
      <line x1="1" y1="32" x2="114" y2="32" stroke="#8a7673" stroke-width="1" />
      <line x1="113" y1="1" x2="113" y2="33" stroke="#8a7673" stroke-width="1" />

      <!-- C# Pixel Logo (Pink version) -->
      <g transform="translate(6, -1)">
        <!-- C -->
        <rect x="12" y="11" width="7" height="2" fill="#ff758f" />
        <rect x="10" y="13" width="2" height="6" fill="#ff758f" />
        <rect x="12" y="19" width="7" height="2" fill="#ff758f" />
        <!-- # -->
        <rect x="23" y="10" width="1.5" height="12" fill="#ff758f" />
        <rect x="26.5" y="10" width="1.5" height="12" fill="#ff758f" />
        <rect x="21" y="13" width="9" height="1.5" fill="#ff758f" />
        <rect x="21" y="17" width="9" height="1.5" fill="#ff758f" />
      </g>
      
      <!-- Text -->
      <text x="80" y="21" font-family="'MS Sans Serif', Arial, sans-serif" font-size="11" font-weight="bold" fill="#4a3e3c">C#</text>
    </g>
  </g>

  <!-- Python Pill (Floating Beveled Button) -->
  <g class="pill-python">
    <g transform="translate(149, 40)">
      <!-- Button Base with Bevel -->
      <rect x="0" y="0" width="115" height="34" fill="#fff5f5" />
      <line x1="0" y1="0" x2="115" y2="0" stroke="#ffffff" stroke-width="1.5" />
      <line x1="0" y1="0" x2="0" y2="34" stroke="#ffffff" stroke-width="1.5" />
      <line x1="0" y1="33" x2="115" y2="33" stroke="#4a3e3c" stroke-width="1.5" />
      <line x1="114" y1="0" x2="114" y2="34" stroke="#4a3e3c" stroke-width="1.5" />
      <line x1="1" y1="32" x2="114" y2="32" stroke="#8a7673" stroke-width="1" />
      <line x1="113" y1="1" x2="113" y2="33" stroke="#8a7673" stroke-width="1" />

      <!-- Python Pixel Logo (Pink/Lavender version) -->
      <g transform="translate(12, 9)">
        <path d="M 4,2 L 10,2 A 2,2 0 0 1 12,4 L 12,7 L 9,7 L 9,5 L 5,5 L 5,8 L 8,8 A 2,2 0 0 1 10,10 L 10,11 L 8,11 L 8,10 L 4,10 A 2,2 0 0 1 2,8 L 2,4 A 2,2 0 0 1 4,2 Z" fill="#ff758f" />
        <circle cx="5" cy="3.5" r="0.7" fill="#ffffff" />
        <path d="M 8,14 L 2,14 A 2,2 0 0 1 0,12 L 0,9 L 3,9 L 3,11 L 7,11 L 7,8 L 4,8 A 2,2 0 0 1 2,6 L 2,5 L 4,5 L 4,6 L 8,6 A 2,2 0 0 1 10,8 L 10,12 A 2,2 0 0 1 8,14 Z" fill="#ffb3c1" />
        <circle cx="7" cy="12.5" r="0.7" fill="#ffffff" />
      </g>
      
      <!-- Text -->
      <text x="80" y="21" font-family="'MS Sans Serif', Arial, sans-serif" font-size="11" font-weight="bold" fill="#4a3e3c">Python</text>
    </g>
  </g>

  <!-- Inset Text Console at Bottom -->
  <g transform="translate(16, 92)">
    <rect x="0" y="0" width="248" height="52" fill="#ffffff" />
    <line x1="0" y1="0" x2="248" y2="0" stroke="#8a7673" stroke-width="1" />
    <line x1="0" y1="0" x2="0" y2="52" stroke="#8a7673" stroke-width="1" />
    <line x1="0" y1="51" x2="248" y2="51" stroke="#ffffff" stroke-width="0.8" />
    <line x1="247" y1="0" x2="247" y2="52" stroke="#ffffff" stroke-width="0.8" />
    
    <text x="10" y="20" font-family="'Courier New', Courier, monospace" font-size="10" font-weight="bold" fill="#ff758f">C:\LANG> type details.txt</text>
    <text x="10" y="38" font-family="'Courier New', Courier, monospace" font-size="10" fill="#4a3e3c">Enfoque: Software y Automatización</text>
  </g>
</svg>
