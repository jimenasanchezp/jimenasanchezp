<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 160" width="280" height="160">
  <style>
    @keyframes border-pulse {
      0%, 100% { stroke-opacity: 0.3; stroke-width: 1; stroke: #d4c5b9; }
      50% { stroke-opacity: 0.8; stroke-width: 1.5; stroke: #e6ca9c; }
    }
    @keyframes float-csharp {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-4px); }
    }
    @keyframes float-python {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-4px); }
    }

    .card-border {
      animation: border-pulse 4s ease-in-out infinite;
    }
    .pill-csharp {
      animation: float-csharp 3s ease-in-out infinite;
    }
    .pill-python {
      animation: float-python 3s ease-in-out infinite 0.7s;
    }
  </style>

  <!-- Card Background & Border -->
  <rect class="card-border" x="1" y="1" width="278" height="158" rx="12" fill="#0d0c10" stroke="#d4c5b9" stroke-width="1" />
  
  <!-- Title -->
  <text x="24" y="38" font-family="'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="bold" fill="#f3eee3">Languages</text>
  
  <!-- C# Pill -->
  <g class="pill-csharp">
    <g transform="translate(24, 70)">
      <rect x="0" y="0" width="70" height="32" rx="16" fill="#1c1917" stroke="#e6ca9c" stroke-width="1.5" />
      <text x="35" y="20" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="bold" fill="#f3eee3" text-anchor="middle">C#</text>
    </g>
  </g>

  <!-- Python Pill -->
  <g class="pill-python">
    <g transform="translate(109, 70)">
      <rect x="0" y="0" width="90" height="32" rx="16" fill="#1c1917" stroke="#e6ca9c" stroke-width="1.5" />
      <text x="45" y="20" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="bold" fill="#f3eee3" text-anchor="middle">Python</text>
    </g>
  </g>
</svg>
