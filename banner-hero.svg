<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 280" width="100%" height="280" fill="none">
  <!-- CSS Animations -->
  <style>
    @keyframes float-slow {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }
    @keyframes tail-wag {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(-6deg); }
    }
    @keyframes eyes-blink {
      0%, 96%, 100% { transform: scaleY(1); }
      98% { transform: scaleY(0.1); }
    }
    @keyframes float-particle-1 {
      0%, 100% { transform: translate(0, 0) scale(0.9); opacity: 0.6; }
      50% { transform: translate(6px, -15px) scale(1.1); opacity: 1; }
    }
    @keyframes float-particle-2 {
      0%, 100% { transform: translate(0, 0) scale(1); opacity: 0.5; }
      50% { transform: translate(-10px, -20px) scale(1.2); opacity: 0.9; }
    }
    @keyframes spin-sparkle {
      0% { transform: rotate(0deg) scale(0.9); opacity: 0.7; }
      50% { transform: rotate(180deg) scale(1.2); opacity: 1; }
      100% { transform: rotate(360deg) scale(0.9); opacity: 0.7; }
    }
    @keyframes pulse-shadow {
      0%, 100% { transform: scaleX(1); opacity: 0.15; }
      50% { transform: scaleX(1.08); opacity: 0.25; }
    }
    @keyframes blink {
      0%, 100% { opacity: 0; }
      50% { opacity: 1; }
    }
    @keyframes border-glow {
      0%, 100% { stroke: #d4c5b9; stroke-opacity: 0.4; }
      50% { stroke: #e6ca9c; stroke-opacity: 0.8; }
    }

    /* Classes */
    .terminal-border {
      animation: border-glow 4s ease-in-out infinite;
    }
    .cursor {
      animation: blink 1s step-end infinite;
    }
    .cat-group {
      transform-origin: 220px 240px;
      animation: float-slow 4s ease-in-out infinite;
    }
    .cat-tail {
      transform-origin: 140px 240px;
      animation: tail-wag 2.5s ease-in-out infinite;
    }
    .cat-eyes {
      transform-origin: 220px 170px;
      animation: eyes-blink 6s infinite;
    }
    .shadow-ellipse {
      transform-origin: 220px 320px;
      animation: pulse-shadow 4s ease-in-out infinite;
    }
    .sparkle-1 {
      transform-origin: 105px 235px;
      animation: spin-sparkle 6s linear infinite;
    }
    .sparkle-2 {
      transform-origin: 125px 125px;
      animation: spin-sparkle 4s linear infinite;
    }
    .particle-plus-1 {
      transform-origin: 325px 115px;
      animation: float-particle-1 5s ease-in-out infinite;
    }
    .particle-circle-1 {
      transform-origin: 345px 155px;
      animation: float-particle-2 7s ease-in-out infinite;
    }
    .particle-cross-1 {
      transform-origin: 335px 275px;
      animation: float-particle-1 6s ease-in-out infinite;
    }
  </style>

  <!-- 1. TERMINAL WINDOW (Left Side) -->
  <g transform="translate(10, 10)">
    <!-- Terminal Background -->
    <rect class="terminal-border" x="0" y="0" width="470" height="240" rx="16" fill="#0d0c10" stroke="#d4c5b9" stroke-width="1.5" />
    
    <!-- Title Bar -->
    <path d="M 0,16 A 16,16 0 0 1 16,0 L 454,0 A 16,16 0 0 1 470,16 L 470,40 L 0,40 Z" fill="#1c1917" />
    
    <!-- Title Bar Buttons (Cozy Theme Colors) -->
    <circle cx="24" cy="20" r="6" fill="#e6ca9c" />
    <circle cx="42" cy="20" r="6" fill="#d4c5b9" />
    <circle cx="60" cy="20" r="6" fill="#f3eee3" opacity="0.5" />
    
    <!-- Window Title -->
    <text x="235" y="25" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="bold" fill="#a39e93" text-anchor="middle">jimena@informatics:~</text>
    
    <!-- Terminal Body Content -->
    <text x="28" y="75" font-family="'Courier New', Courier, monospace" font-size="16" font-weight="bold" fill="#e6ca9c">👋 hola_mundo.cs</text>
    
    <text x="28" y="115" font-family="'Courier New', Courier, monospace" font-size="15" fill="#f3eee3">
      <tspan fill="#a39e93">nombre:</tspan> Jimena
    </text>
    
    <text x="28" y="145" font-family="'Courier New', Courier, monospace" font-size="15" fill="#f3eee3">
      <tspan fill="#a39e93">carrera:</tspan> Estudiante de Informática
    </text>

    <text x="28" y="175" font-family="'Courier New', Courier, monospace" font-size="15" fill="#f3eee3">
      <tspan fill="#a39e93">stack:</tspan> C# | Python | .NET
    </text>

    <text x="28" y="210" font-family="'Courier New', Courier, monospace" font-size="14" fill="#e6ca9c">
      > buscando ideas y proyectos interesantes...<tspan class="cursor" fill="#f3eee3">_</tspan>
    </text>
  </g>

  <!-- 2. ANIMATED CAT & SPARKLES (Right Side, scaled and translated) -->
  <g transform="translate(410, -40) scale(0.85)">
    <!-- Shadow below cat -->
    <ellipse class="shadow-ellipse" cx="220" cy="320" rx="90" ry="12" fill="#d4c5b9" opacity="0.2" />

    <!-- The Cat Group (Breathing/Floating) -->
    <g class="cat-group">
      <!-- Tail (Wagging) -->
      <g class="cat-tail" fill="#f3eee3">
        <rect x="120" y="180" width="16" height="16" rx="2" />
        <rect x="104" y="196" width="16" height="16" rx="2" />
        <rect x="120" y="212" width="16" height="32" rx="2" />
        <rect x="136" y="228" width="16" height="16" rx="2" />
      </g>

      <!-- Cat Body & Head -->
      <g fill="#f3eee3">
        <!-- Ears -->
        <rect x="160" y="100" width="16" height="16" rx="2" />
        <rect x="176" y="116" width="16" height="16" rx="2" />
        <rect x="160" y="116" width="16" height="16" rx="2" />
        
        <rect x="264" y="100" width="16" height="16" rx="2" />
        <rect x="248" y="116" width="16" height="16" rx="2" />
        <rect x="264" y="116" width="16" height="16" rx="2" />

        <!-- Head Base -->
        <rect x="176" y="132" width="88" height="64" rx="4" />
        <!-- Cheeks -->
        <rect x="160" y="148" width="16" height="32" rx="2" />
        <rect x="264" y="148" width="16" height="32" rx="2" />

        <!-- Body / Torso -->
        <rect x="160" y="196" width="120" height="80" rx="6" />
        <!-- Paws -->
        <rect x="176" y="276" width="24" height="16" rx="3" />
        <rect x="240" y="276" width="24" height="16" rx="3" />
      </g>

      <!-- Inner Ears (Obsidian Black) -->
      <g fill="#121212">
        <rect x="164" y="120" width="8" height="8" rx="1" />
        <rect x="268" y="120" width="8" height="8" rx="1" />
      </g>

      <!-- Eyes (Blinking Group) -->
      <g class="cat-eyes">
        <!-- Left Eye -->
        <rect x="192" y="156" width="12" height="20" rx="2" fill="#ffffff" />
        <rect x="196" y="160" width="8" height="12" rx="1" fill="#121212" />
        <!-- Right Eye -->
        <rect x="236" y="156" width="12" height="20" rx="2" fill="#ffffff" />
        <rect x="240" y="160" width="8" height="12" rx="1" fill="#121212" />
      </g>

      <!-- Nose / Mouth -->
      <rect x="216" y="176" width="8" height="6" rx="1.5" fill="#121212" />
    </g>

    <!-- Sparkles & Particles -->
    <!-- Sparkle 1 -->
    <path class="sparkle-1" d="M 105,220 L 108,231 L 119,234 L 108,237 L 105,248 L 102,237 L 91,234 L 102,231 Z" fill="#e6ca9c" />
    
    <!-- Sparkle 2 -->
    <path class="sparkle-2" d="M 125,113 L 127,121 L 135,123 L 127,125 L 125,133 L 123,125 L 115,123 L 123,121 Z" fill="#fdfaf2" />

    <!-- Plus 1 -->
    <g class="particle-plus-1">
      <rect x="322" y="105" width="6" height="20" rx="2" fill="#e6ca9c" />
      <rect x="315" y="112" width="20" height="6" rx="2" fill="#e6ca9c" />
    </g>

    <!-- Circle 1 -->
    <circle class="particle-circle-1" cx="345" cy="155" r="8" stroke="#d4c5b9" stroke-width="4" fill="none" />

    <!-- Cross 1 -->
    <g class="particle-cross-1" style="transform: rotate(45deg); transform-origin: 335px 275px;">
      <rect x="332" y="265" width="6" height="20" rx="2" fill="#fdfaf2" />
      <rect x="325" y="272" width="20" height="6" rx="2" fill="#fdfaf2" />
    </g>
  </g>
</svg>
