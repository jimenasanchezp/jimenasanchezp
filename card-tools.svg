<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 160" width="280" height="160">
  <style>
    @keyframes border-pulse {
      0%, 100% { stroke-opacity: 0.3; stroke-width: 1; stroke: #d4c5b9; }
      50% { stroke-opacity: 0.8; stroke-width: 1.5; stroke: #e6ca9c; }
    }
    @keyframes float-pill {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-3px); }
    }

    .card-border {
      animation: border-pulse 4s ease-in-out infinite;
    }
    .pill-net {
      animation: float-pill 3s ease-in-out infinite 0.1s;
    }
    .pill-git {
      animation: float-pill 3s ease-in-out infinite 0.3s;
    }
    .pill-vscode {
      animation: float-pill 3s ease-in-out infinite 0.5s;
    }
    .pill-django {
      animation: float-pill 3s ease-in-out infinite 0.7s;
    }
    .pill-pytest {
      animation: float-pill 3s ease-in-out infinite 0.9s;
    }
  </style>

  <!-- Card Background & Border -->
  <rect class="card-border" x="1" y="1" width="278" height="158" rx="12" fill="#0d0c10" stroke="#d4c5b9" stroke-width="1" />
  
  <!-- Title -->
  <text x="24" y="38" font-family="'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="bold" fill="#f3eee3">Tools &amp; Tech</text>
  
  <!-- .NET Pill -->
  <g class="pill-net">
    <g transform="translate(24, 60)">
      <rect x="0" y="0" width="60" height="24" rx="12" fill="#1c1917" stroke="#e6ca9c" stroke-width="1.5" />
      <text x="30" y="16" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#f3eee3" text-anchor="middle">.NET</text>
    </g>
  </g>

  <!-- Git Pill -->
  <g class="pill-git">
    <g transform="translate(94, 60)">
      <rect x="0" y="0" width="50" height="24" rx="12" fill="#1c1917" stroke="#e6ca9c" stroke-width="1.5" />
      <text x="25" y="16" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#f3eee3" text-anchor="middle">Git</text>
    </g>
  </g>

  <!-- VS Code Pill -->
  <g class="pill-vscode">
    <g transform="translate(154, 60)">
      <rect x="0" y="0" width="80" height="24" rx="12" fill="#1c1917" stroke="#e6ca9c" stroke-width="1.5" />
      <text x="40" y="16" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#f3eee3" text-anchor="middle">VS Code</text>
    </g>
  </g>

  <!-- Django Pill -->
  <g class="pill-django">
    <g transform="translate(24, 96)">
      <rect x="0" y="0" width="75" height="24" rx="12" fill="#1c1917" stroke="#e6ca9c" stroke-width="1.5" />
      <text x="37.5" y="16" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#f3eee3" text-anchor="middle">Django</text>
    </g>
  </g>

  <!-- Pytest Pill -->
  <g class="pill-pytest">
    <g transform="translate(109, 96)">
      <rect x="0" y="0" width="70" height="24" rx="12" fill="#1c1917" stroke="#e6ca9c" stroke-width="1.5" />
      <text x="35" y="16" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#f3eee3" text-anchor="middle">Pytest</text>
    </g>
  </g>
</svg>
