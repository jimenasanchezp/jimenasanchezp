<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 280" width="100%" height="280" fill="none">
  <!-- CSS Animations & Styles -->
  <style>
    @keyframes float-slow {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-6px); }
    }
    @keyframes tail-wag {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(-5deg); }
    }
    @keyframes eyes-blink {
      0%, 96%, 100% { transform: scaleY(1); }
      98% { transform: scaleY(0.15); }
    }
    @keyframes spin-sparkle {
      0% { transform: rotate(0deg) scale(0.9); opacity: 0.7; }
      50% { transform: rotate(180deg) scale(1.2); opacity: 1; }
      100% { transform: rotate(360deg) scale(0.9); opacity: 0.7; }
    }
    @keyframes blink {
      0%, 100% { opacity: 0; }
      50% { opacity: 1; }
    }
    @keyframes pulse-shadow {
      0%, 100% { transform: scaleX(1); opacity: 0.15; }
      50% { transform: scaleX(1.08); opacity: 0.25; }
    }

    .cursor {
      animation: blink 1s step-end infinite;
    }
    .cat-group {
      transform-origin: 220px 240px;
      animation: float-slow 4.5s ease-in-out infinite;
    }
    .cat-tail {
      transform-origin: 140px 240px;
      animation: tail-wag 2.5s ease-in-out infinite;
    }
    .cat-eyes {
      transform-origin: 220px 185px;
      animation: eyes-blink 5.5s infinite;
    }
    .shadow-ellipse {
      transform-origin: 220px 320px;
      animation: pulse-shadow 4.5s ease-in-out infinite;
    }
    .sparkle {
      transform-origin: 105px 235px;
      animation: spin-sparkle 5s linear infinite;
    }
  </style>

  <!-- 1. WINDOW SHELL (Windows 95 3D Bevel) -->
  <!-- Outer window background -->
  <rect x="0" y="0" width="800" height="280" fill="#f5e6e3" />
  
  <!-- Outer Bevel: Light top/left, Dark bottom/right -->
  <line x1="0" y1="0" x2="800" y2="0" stroke="#ffffff" stroke-width="2" />
  <line x1="0" y1="0" x2="0" y2="280" stroke="#ffffff" stroke-width="2" />
  <line x1="0" y1="279" x2="800" y2="279" stroke="#4a3e3c" stroke-width="2" />
  <line x1="799" y1="0" x2="799" y2="280" stroke="#4a3e3c" stroke-width="2" />
  <line x1="1" y1="278" x2="799" y2="278" stroke="#8a7673" stroke-width="1.5" />
  <line x1="798" y1="1" x2="798" y2="279" stroke="#8a7673" stroke-width="1.5" />

  <!-- 2. TITLE BAR -->
  <!-- Gradient: bright pink to baby pink -->
  <linearGradient id="title-gradient" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#ff758f" />
    <stop offset="100%" stop-color="#ffb3c1" />
  </linearGradient>
  <rect x="5" y="5" width="790" height="25" fill="url(#title-gradient)" />

  <!-- Title Text -->
  <text x="15" y="22" font-family="'MS Sans Serif', Arial, sans-serif" font-size="12" font-weight="bold" fill="#ffffff">Jimena_Sanchez.exe</text>

  <!-- Windows Control Buttons (Minimize, Maximize, Close) -->
  <!-- Minimize Button -->
  <g transform="translate(730, 8)">
    <rect x="0" y="0" width="16" height="14" fill="#f5e6e3" />
    <line x1="0" y1="0" x2="16" y2="0" stroke="#ffffff" stroke-width="1" />
    <line x1="0" y1="0" x2="0" y2="14" stroke="#ffffff" stroke-width="1" />
    <line x1="0" y1="13" x2="16" y2="13" stroke="#4a3e3c" stroke-width="1" />
    <line x1="15" y1="0" x2="15" y2="14" stroke="#4a3e3c" stroke-width="1" />
    <line x1="3" y1="10" x2="11" y2="10" stroke="#000000" stroke-width="2" />
  </g>
  
  <!-- Maximize Button -->
  <g transform="translate(750, 8)">
    <rect x="0" y="0" width="16" height="14" fill="#f5e6e3" />
    <line x1="0" y1="0" x2="16" y2="0" stroke="#ffffff" stroke-width="1" />
    <line x1="0" y1="0" x2="0" y2="14" stroke="#ffffff" stroke-width="1" />
    <line x1="0" y1="13" x2="16" y2="13" stroke="#4a3e3c" stroke-width="1" />
    <line x1="15" y1="0" x2="15" y2="14" stroke="#4a3e3c" stroke-width="1" />
    <rect x="3" y="3" width="10" height="8" stroke="#000000" stroke-width="1.5" fill="none" />
  </g>

  <!-- Close Button -->
  <g transform="translate(770, 8)">
    <rect x="0" y="0" width="16" height="14" fill="#f5e6e3" />
    <line x1="0" y1="0" x2="16" y2="0" stroke="#ffffff" stroke-width="1" />
    <line x1="0" y1="0" x2="0" y2="14" stroke="#ffffff" stroke-width="1" />
    <line x1="0" y1="13" x2="16" y2="13" stroke="#4a3e3c" stroke-width="1" />
    <line x1="15" y1="0" x2="15" y2="14" stroke="#4a3e3c" stroke-width="1" />
    <!-- X shape -->
    <path d="M 4,3 L 12,11 M 12,3 L 4,11" stroke="#000000" stroke-width="1.5" />
  </g>

  <!-- 3. CLIENT AREA (Inside Console Box) -->
  <!-- Inset Bevel Box -->
  <rect x="15" y="42" width="460" height="223" fill="#ffffff" />
  <!-- Inset Shadow: dark top/left, light bottom/right -->
  <line x1="15" y1="42" x2="475" y2="42" stroke="#8a7673" stroke-width="1.5" />
  <line x1="15" y1="42" x2="15" y2="265" stroke="#8a7673" stroke-width="1.5" />
  <line x1="15" y1="264" x2="475" y2="264" stroke="#ffffff" stroke-width="1" />
  <line x1="474" y1="42" x2="474" y2="265" stroke="#ffffff" stroke-width="1" />

  <!-- Console Text (Classic Monospace in Pink & Charcoal) -->
  <text x="30" y="75" font-family="'Courier New', Courier, monospace" font-size="14" font-weight="bold" fill="#ff758f">C:\WINDOWS\SYSTEM> type info.txt</text>
  
  <text x="30" y="110" font-family="'Courier New', Courier, monospace" font-size="14" font-weight="bold" fill="#4a3e3c">
    Nombre: <tspan fill="#ff758f">Jimena Sanchez</tspan>
  </text>
  
  <text x="30" y="140" font-family="'Courier New', Courier, monospace" font-size="14" font-weight="bold" fill="#4a3e3c">
    Carrera: <tspan fill="#8a7673">Estudiante de Informática</tspan>
  </text>

  <text x="30" y="170" font-family="'Courier New', Courier, monospace" font-size="14" font-weight="bold" fill="#4a3e3c">
    Stack: <tspan fill="#ff758f">C#</tspan> | <tspan fill="#ff758f">Python</tspan> | <tspan fill="#ff758f">.NET</tspan>
  </text>

  <text x="30" y="205" font-family="'Courier New', Courier, monospace" font-size="14" font-weight="bold" fill="#4a3e3c">
    Estado: <tspan fill="#ff758f">Activamente buscando proyectos Y2K... ✨</tspan>
  </text>

  <text x="30" y="240" font-family="'Courier New', Courier, monospace" font-size="14" font-weight="bold" fill="#ff758f">> <tspan class="cursor" fill="#ff758f">_</tspan></text>

  <!-- 4. KAWAII ANIMATED CAT (Right Side) -->
  <g transform="translate(425, -45) scale(0.85)">
    <!-- Shadow below cat -->
    <ellipse class="shadow-ellipse" cx="220" cy="320" rx="90" ry="12" fill="#ffb3c1" opacity="0.3" />

    <!-- The Computer Group (Floating/Breathing) -->
    <g class="cat-group">
      <!-- Monitor Stand / Neck -->
      <path d="M 205,250 L 235,250 L 245,266 L 195,266 Z" fill="#ecdcd9" stroke="#8a7673" stroke-width="1.2" />
      <line x1="197" y1="265" x2="243" y2="265" stroke="#ffffff" stroke-width="1" />

      <!-- Desktop Case (Horizontal Tower) -->
      <rect x="120" y="265" width="200" height="40" fill="#f5e6e3" />
      <line x1="120" y1="265" x2="320" y2="265" stroke="#ffffff" stroke-width="1.8" />
      <line x1="120" y1="265" x2="120" y2="305" stroke="#ffffff" stroke-width="1.8" />
      <line x1="120" y1="304" x2="320" y2="304" stroke="#4a3e3c" stroke-width="1.8" />
      <line x1="319" y1="265" x2="319" y2="305" stroke="#4a3e3c" stroke-width="1.8" />
      <line x1="121" y1="303" x2="319" y2="303" stroke="#8a7673" stroke-width="1" />
      <line x1="318" y1="266" x2="318" y2="304" stroke="#8a7673" stroke-width="1" />

      <!-- Floppy drive slot -->
      <rect x="135" y="278" width="45" height="4" fill="#4a3e3c" />
      <rect x="145" y="280" width="3" height="3" fill="#ff758f" />
      <!-- CD-ROM Drive slot -->
      <rect x="135" y="288" width="60" height="8" fill="#ecdcd9" stroke="#8a7673" stroke-width="1" />
      <rect x="185" y="291" width="6" height="2" fill="#ff758f" />
      <!-- Power button (LED) -->
      <circle cx="295" cy="285" r="4" fill="#ff758f" />
      <circle cx="295" cy="285" r="2" fill="#ffffff" opacity="0.6" />

      <!-- Monitor Casing -->
      <rect x="140" y="130" width="160" height="120" rx="14" fill="#f5e6e3" />
      <rect x="140" y="130" width="160" height="120" rx="14" stroke="#ffffff" stroke-width="1.8" fill="none" />
      <rect x="141" y="131" width="158" height="118" rx="13" stroke="#8a7673" stroke-width="1.2" fill="none" />

      <!-- Screen Frame Bezel -->
      <rect x="152" y="142" width="136" height="96" rx="8" fill="#ecdcd9" stroke="#8a7673" stroke-width="1.2" />

      <!-- Screen Glass (Neon Pink) -->
      <rect x="162" y="152" width="116" height="76" rx="4" fill="#ff758f" />
      <rect x="162" y="152" width="116" height="76" rx="4" stroke="#4a3e3c" stroke-width="1.5" fill="none" />

      <!-- Kawaii blushing cheeks on screen -->
      <ellipse cx="178" cy="198" rx="8" ry="4" fill="#ffffff" opacity="0.6" />
      <ellipse cx="262" cy="198" rx="8" ry="4" fill="#ffffff" opacity="0.6" />

      <!-- Smile -->
      <path d="M 215,198 Q 220,204 225,198" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" fill="none" />

      <!-- Eyes (Blinking Group) -->
      <g class="cat-eyes">
        <path d="M 185,188 L 195,182 L 205,188" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" fill="none" />
        <path d="M 235,188 L 245,182 L 255,188" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" fill="none" />
      </g>
    </g>

    <!-- Kawaii Y2K Sparkles -->
    <!-- Sparkle 1 (Fucsia) -->
    <path class="sparkle" d="M 105,220 L 108,231 L 119,234 L 108,237 L 105,248 L 102,237 L 91,234 L 102,231 Z" fill="#ff758f" />
    <!-- Sparkle 2 (Pastel Yellow) -->
    <path class="sparkle" d="M 125,113 L 127,121 L 135,123 L 127,125 L 125,133 L 123,125 L 115,123 L 123,121 Z" fill="#fbf7c7" style="animation-delay: 2s;" />
    <!-- Plus Icon (Lavender) -->
    <g transform="translate(315, 105)">
      <rect x="8" y="0" width="4" height="20" rx="1" fill="#e2d4f0" />
      <rect x="0" y="8" width="20" height="4" rx="1" fill="#e2d4f0" />
    </g>
  </g>
</svg>
