<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 38" width="140" height="38" fill="none">
  <defs>
    <clipPath id="btn-clip">
      <rect x="2" y="2" width="136" height="34" rx="3" />
    </clipPath>
    <linearGradient id="shimmer-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
  </defs>

  <style>
    @keyframes shine {
      0% { transform: translateX(-150px) skewX(-30deg); }
      30%, 100% { transform: translateX(180px) skewX(-30deg); }
    }
    .shimmer-rect {
      animation: shine 4s ease-in-out infinite 0.5s;
    }
  </style>

  <!-- Button Background (Classic Windows 95 bevel) -->
  <rect x="0" y="0" width="140" height="38" fill="#f5e6e3" rx="3" />
  
  <!-- Outer Bevel Lines -->
  <line x1="0" y1="0" x2="140" y2="0" stroke="#ffffff" stroke-width="2.5" />
  <line x1="0" y1="0" x2="0" y2="38" stroke="#ffffff" stroke-width="2.5" />
  <line x1="0" y1="37" x2="140" y2="37" stroke="#4a3e3c" stroke-width="2.5" />
  <line x1="139" y1="0" x2="139" y2="38" stroke="#4a3e3c" stroke-width="2.5" />
  <line x1="1" y1="36" x2="139" y2="36" stroke="#8a7673" stroke-width="1.5" />
  <line x1="138" y1="1" x2="138" y2="37" stroke="#8a7673" stroke-width="1.5" />

  <!-- Shimmer Effect inside button -->
  <g clip-path="url(#btn-clip)">
    <rect class="shimmer-rect" x="0" y="0" width="60" height="38" fill="url(#shimmer-grad)" />
  </g>

  <!-- Pixel Art Camera Icon (Pink) -->
  <g transform="translate(18, 5)">
    <rect x="0" y="3" width="14" height="11" rx="2.5" stroke="#ff758f" stroke-width="1.2" fill="#fff5f5" />
    <circle cx="7" cy="8.5" r="2.8" stroke="#ff758f" stroke-width="1" />
    <rect x="10.5" y="5.5" width="1.2" height="1.2" fill="#ff758f" />
  </g>

  <!-- Text -->
  <text x="78" y="23" font-family="'MS Sans Serif', Arial, sans-serif" font-size="11" font-weight="bold" fill="#4a3e3c" text-anchor="middle">Instagram</text>
</svg>
