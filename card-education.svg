<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 160" width="280" height="160">
  <style>
    @keyframes border-pulse {
      0%, 100% { stroke-opacity: 0.3; stroke-width: 1; stroke: #d4c5b9; }
      50% { stroke-opacity: 0.8; stroke-width: 1.5; stroke: #e6ca9c; }
    }
    @keyframes float-pill {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-3px); }
    }

    .card-border {
      animation: border-pulse 4s ease-in-out infinite;
    }
    .pill-informatics {
      animation: float-pill 3s ease-in-out infinite 0.2s;
    }
    .pill-algorithms {
      animation: float-pill 3s ease-in-out infinite 0.4s;
    }
    .pill-databases {
      animation: float-pill 3s ease-in-out infinite 0.6s;
    }
    .pill-oop {
      animation: float-pill 3s ease-in-out infinite 0.8s;
    }
  </style>

  <!-- Card Background & Border -->
  <rect class="card-border" x="1" y="1" width="278" height="158" rx="12" fill="#0d0c10" stroke="#d4c5b9" stroke-width="1" />
  
  <!-- Title -->
  <text x="24" y="38" font-family="'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="bold" fill="#f3eee3">Education</text>
  
  <!-- Informatics Pill -->
  <g class="pill-informatics">
    <g transform="translate(24, 60)">
      <rect x="0" y="0" width="115" height="24" rx="12" fill="#1c1917" stroke="#e6ca9c" stroke-width="1.5" />
      <text x="57.5" y="16" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#f3eee3" text-anchor="middle">Informatics Eng.</text>
    </g>
  </g>

  <!-- Algorithms Pill -->
  <g class="pill-algorithms">
    <g transform="translate(149, 60)">
      <rect x="0" y="0" width="90" height="24" rx="12" fill="#1c1917" stroke="#e6ca9c" stroke-width="1.5" />
      <text x="45" y="16" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#f3eee3" text-anchor="middle">Algorithms</text>
    </g>
  </g>

  <!-- Databases Pill -->
  <g class="pill-databases">
    <g transform="translate(24, 96)">
      <rect x="0" y="0" width="85" height="24" rx="12" fill="#1c1917" stroke="#e6ca9c" stroke-width="1.5" />
      <text x="42.5" y="16" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#f3eee3" text-anchor="middle">Databases</text>
    </g>
  </g>

  <!-- OOP Pill -->
  <g class="pill-oop">
    <g transform="translate(119, 96)">
      <rect x="0" y="0" width="60" height="24" rx="12" fill="#1c1917" stroke="#e6ca9c" stroke-width="1.5" />
      <text x="30" y="16" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#f3eee3" text-anchor="middle">OOP</text>
    </g>
  </g>
</svg>
