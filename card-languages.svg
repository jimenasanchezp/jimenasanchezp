<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 160" width="280" height="160" fill="none">
  <defs>
    <!-- Background Glow -->
    <radialGradient id="card-glow" cx="50%" cy="100%" r="80%">
      <stop offset="0%" stop-color="#e6ca9c" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#e6ca9c" stop-opacity="0" />
    </radialGradient>
    <!-- Border Gradient -->
    <linearGradient id="border-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e6ca9c" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#d4c5b9" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#e6ca9c" stop-opacity="0.8" />
    </linearGradient>
  </defs>

  <style>
    @keyframes float-csharp {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-4px); }
    }
    @keyframes float-python {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-4px); }
    }
    @keyframes border-pulse {
      0%, 100% { stroke-opacity: 0.4; }
      50% { stroke-opacity: 0.9; }
    }
    .card-bg {
      fill: #0d0c10;
    }
    .card-border {
      stroke: url(#border-grad);
      stroke-width: 1.5;
      animation: border-pulse 4s ease-in-out infinite;
    }
    .pill-csharp {
      animation: float-csharp 3s ease-in-out infinite;
    }
    .pill-python {
      animation: float-python 3s ease-in-out infinite 0.7s;
    }
  </style>

  <!-- Card Body -->
  <rect class="card-bg" x="1" y="1" width="278" height="158" rx="14" />
  <rect x="1" y="1" width="278" height="158" rx="14" fill="url(#card-glow)" />
  <rect class="card-border" x="1" y="1" width="278" height="158" rx="14" />

  <!-- Section Title -->
  <text x="24" y="34" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="bold" fill="#e6ca9c" letter-spacing="1.5">LENGUAJES</text>
  
  <!-- Tiny pixel separator -->
  <line x1="24" y1="44" x2="256" y2="44" stroke="#d4c5b9" stroke-opacity="0.15" stroke-dasharray="2 2" stroke-width="2" />

  <!-- C# Pill -->
  <g class="pill-csharp">
    <g transform="translate(24, 65)">
      <!-- Pill Container -->
      <rect x="0" y="0" width="105" height="34" rx="17" fill="#1c1917" stroke="#e6ca9c" stroke-width="1.2" />
      
      <!-- C# Pixel Logo -->
      <g transform="translate(4, -1)">
        <!-- C -->
        <rect x="12" y="11" width="7" height="2" fill="#e6ca9c" />
        <rect x="10" y="13" width="2" height="6" fill="#e6ca9c" />
        <rect x="12" y="19" width="7" height="2" fill="#e6ca9c" />
        <!-- # -->
        <rect x="23" y="10" width="1.5" height="12" fill="#e6ca9c" />
        <rect x="26.5" y="10" width="1.5" height="12" fill="#e6ca9c" />
        <rect x="21" y="13" width="9" height="1.5" fill="#e6ca9c" />
        <rect x="21" y="17" width="9" height="1.5" fill="#e6ca9c" />
      </g>

      <!-- Label -->
      <text x="70" y="21" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="bold" fill="#f3eee3" text-anchor="middle">C#</text>
    </g>
  </g>

  <!-- Python Pill -->
  <g class="pill-python">
    <g transform="translate(141, 65)">
      <!-- Pill Container -->
      <rect x="0" y="0" width="115" height="34" rx="17" fill="#1c1917" stroke="#e6ca9c" stroke-width="1.2" />
      
      <!-- Python Pixel Logo -->
      <g transform="translate(12, 9)">
        <!-- Upper Snake (Beige) -->
        <path d="M 4,2 L 10,2 A 2,2 0 0 1 12,4 L 12,7 L 9,7 L 9,5 L 5,5 L 5,8 L 8,8 A 2,2 0 0 1 10,10 L 10,11 L 8,11 L 8,10 L 4,10 A 2,2 0 0 1 2,8 L 2,4 A 2,2 0 0 1 4,2 Z" fill="#e6ca9c" />
        <circle cx="5" cy="3.5" r="0.7" fill="#121212" />

        <!-- Lower Snake (Taupe) -->
        <path d="M 8,14 L 2,14 A 2,2 0 0 1 0,12 L 0,9 L 3,9 L 3,11 L 7,11 L 7,8 L 4,8 A 2,2 0 0 1 2,6 L 2,5 L 4,5 L 4,6 L 8,6 A 2,2 0 0 1 10,8 L 10,12 A 2,2 0 0 1 8,14 Z" fill="#d4c5b9" />
        <circle cx="7" cy="12.5" r="0.7" fill="#121212" />
      </g>

      <!-- Label -->
      <text x="74" y="21" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="bold" fill="#f3eee3" text-anchor="middle">Python</text>
    </g>
  </g>

  <!-- Extra stack tag at bottom -->
  <text x="24" y="134" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" fill="#a39e93">Enfoque: Desarrollo de Software &amp; Datos</text>
</svg>
