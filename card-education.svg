    <text x="57.5" y="16" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">Informatics Eng.</text>
  </g>

  <!-- Algorithms Pill -->
  <g transform="translate(149, 60)">
