<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 160" width="280" height="160" fill="none">
  <!-- CSS Animations & Styles -->
  <style>
    @keyframes float-pill {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-3px); }
    }
    .pill-net { animation: float-pill 3s ease-in-out infinite 0.1s; }
    .pill-git { animation: float-pill 3s ease-in-out infinite 0.3s; }
    .pill-vscode { animation: float-pill 3s ease-in-out infinite 0.5s; }
    .pill-django { animation: float-pill 3s ease-in-out infinite 0.7s; }
    .pill-pytest { animation: float-pill 3s ease-in-out infinite 0.9s; }
  </style>

  <!-- Outer Bevel Shell (Win95 style dialog box) -->
  <rect x="0" y="0" width="280" height="160" fill="#f5e6e3" />
  
  <!-- Outer Bevel Border -->
  <line x1="0" y1="0" x2="280" y2="0" stroke="#ffffff" stroke-width="2" />
  <line x1="0" y1="0" x2="0" y2="160" stroke="#ffffff" stroke-width="2" />
  <line x1="0" y1="159" x2="280" y2="159" stroke="#4a3e3c" stroke-width="2" />
  <line x1="279" y1="0" x2="279" y2="160" stroke="#4a3e3c" stroke-width="2" />
  <line x1="1" y1="158" x2="279" y2="158" stroke="#8a7673" stroke-width="1" />
  <line x1="278" y1="1" x2="278" y2="159" stroke="#8a7673" stroke-width="1" />

  <!-- Title Bar -->
  <linearGradient id="title-grad" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#ff758f" />
    <stop offset="100%" stop-color="#ffb3c1" />
  </linearGradient>
  <rect x="4" y="4" width="272" height="18" fill="url(#title-grad)" />
  <text x="10" y="17" font-family="'MS Sans Serif', Arial, sans-serif" font-size="9" font-weight="bold" fill="#ffffff">Tools.sys</text>

  <!-- Close [X] button -->
  <g transform="translate(260, 8)">
    <rect x="0" y="0" width="12" height="10" fill="#f5e6e3" />
    <line x1="0" y1="0" x2="12" y2="0" stroke="#ffffff" stroke-width="0.8" />
    <line x1="0" y1="0" x2="0" y2="10" stroke="#ffffff" stroke-width="0.8" />
    <line x1="0" y1="9" x2="12" y2="9" stroke="#4a3e3c" stroke-width="0.8" />
    <line x1="11" y1="0" x2="11" y2="10" stroke="#4a3e3c" stroke-width="0.8" />
    <path d="M 3,2 L 9,8 M 9,2 L 3,8" stroke="#000000" stroke-width="1" />
  </g>

  <!-- Wrench Pixel Art (Kawaii Pink) -->
  <g transform="translate(205, 25)" stroke="#ff758f" stroke-width="1.5" stroke-linecap="round" fill="none">
    <circle cx="10" cy="5" r="4.5" />
    <path d="M 8,2 L 12,8" stroke-width="1.5" />
    <line x1="13" y1="8.5" x2="19.5" y2="15" stroke-width="2" />
    <rect x="18" y="14" width="2" height="2" fill="#ff758f" />
  </g>

  <!-- .NET Pill -->
  <g class="pill-net">
    <g transform="translate(14, 40)">
      <rect x="0" y="0" width="56" height="28" fill="#fff5f5" />
      <line x1="0" y1="0" x2="56" y2="0" stroke="#ffffff" stroke-width="1.5" />
      <line x1="0" y1="0" x2="0" y2="28" stroke="#ffffff" stroke-width="1.5" />
      <line x1="0" y1="27" x2="56" y2="27" stroke="#4a3e3c" stroke-width="1.5" />
      <line x1="55" y1="0" x2="55" y2="28" stroke="#4a3e3c" stroke-width="1.5" />
      <line x1="1" y1="26" x2="55" y2="26" stroke="#8a7673" stroke-width="1" />
      <line x1="54" y1="1" x2="54" y2="27" stroke="#8a7673" stroke-width="1" />
      <text x="28" y="17" font-family="'MS Sans Serif', Arial, sans-serif" font-size="10" font-weight="bold" fill="#4a3e3c" text-anchor="middle">.NET</text>
    </g>
  </g>

  <!-- Git Pill -->
  <g class="pill-git">
    <g transform="translate(78, 40)">
      <rect x="0" y="0" width="48" height="28" fill="#fff5f5" />
      <line x1="0" y1="0" x2="48" y2="0" stroke="#ffffff" stroke-width="1.5" />
      <line x1="0" y1="0" x2="0" y2="28" stroke="#ffffff" stroke-width="1.5" />
      <line x1="0" y1="27" x2="48" y2="27" stroke="#4a3e3c" stroke-width="1.5" />
      <line x1="47" y1="0" x2="47" y2="28" stroke="#4a3e3c" stroke-width="1.5" />
      <line x1="1" y1="26" x2="47" y2="26" stroke="#8a7673" stroke-width="1" />
      <line x1="46" y1="1" x2="46" y2="27" stroke="#8a7673" stroke-width="1" />
      <text x="24" y="17" font-family="'MS Sans Serif', Arial, sans-serif" font-size="10" font-weight="bold" fill="#4a3e3c" text-anchor="middle">Git</text>
    </g>
  </g>

  <!-- VS Code Pill -->
  <g class="pill-vscode">
    <g transform="translate(134, 40)">
      <rect x="0" y="0" width="80" height="28" fill="#fff5f5" />
      <line x1="0" y1="0" x2="80" y2="0" stroke="#ffffff" stroke-width="1.5" />
      <line x1="0" y1="0" x2="0" y2="28" stroke="#ffffff" stroke-width="1.5" />
      <line x1="0" y1="27" x2="80" y2="27" stroke="#4a3e3c" stroke-width="1.5" />
      <line x1="79" y1="0" x2="79" y2="28" stroke="#4a3e3c" stroke-width="1.5" />
      <line x1="1" y1="26" x2="79" y2="26" stroke="#8a7673" stroke-width="1" />
      <line x1="78" y1="1" x2="78" y2="27" stroke="#8a7673" stroke-width="1" />
      <text x="40" y="17" font-family="'MS Sans Serif', Arial, sans-serif" font-size="10" font-weight="bold" fill="#4a3e3c" text-anchor="middle">VS Code</text>
    </g>
  </g>

  <!-- Django Pill -->
  <g class="pill-django">
    <g transform="translate(14, 76)">
      <rect x="0" y="0" width="80" height="28" fill="#fff5f5" />
      <line x1="0" y1="0" x2="80" y2="0" stroke="#ffffff" stroke-width="1.5" />
      <line x1="0" y1="0" x2="0" y2="28" stroke="#ffffff" stroke-width="1.5" />
      <line x1="0" y1="27" x2="80" y2="27" stroke="#4a3e3c" stroke-width="1.5" />
      <line x1="79" y1="0" x2="79" y2="28" stroke="#4a3e3c" stroke-width="1.5" />
      <line x1="1" y1="26" x2="79" y2="26" stroke="#8a7673" stroke-width="1" />
      <line x1="78" y1="1" x2="78" y2="27" stroke="#8a7673" stroke-width="1" />
      <text x="40" y="17" font-family="'MS Sans Serif', Arial, sans-serif" font-size="10" font-weight="bold" fill="#4a3e3c" text-anchor="middle">Django</text>
    </g>
  </g>

  <!-- Pytest Pill -->
  <g class="pill-pytest">
    <g transform="translate(102, 76)">
      <rect x="0" y="0" width="75" height="28" fill="#fff5f5" />
      <line x1="0" y1="0" x2="75" y2="0" stroke="#ffffff" stroke-width="1.5" />
      <line x1="0" y1="0" x2="0" y2="28" stroke="#ffffff" stroke-width="1.5" />
      <line x1="0" y1="27" x2="75" y2="27" stroke="#4a3e3c" stroke-width="1.5" />
      <line x1="74" y1="0" x2="74" y2="28" stroke="#4a3e3c" stroke-width="1.5" />
      <line x1="1" y1="26" x2="74" y2="26" stroke="#8a7673" stroke-width="1" />
      <line x1="73" y1="1" x2="73" y2="27" stroke="#8a7673" stroke-width="1" />
      <text x="37.5" y="17" font-family="'MS Sans Serif', Arial, sans-serif" font-size="10" font-weight="bold" fill="#4a3e3c" text-anchor="middle">Pytest</text>
    </g>
  </g>

  <!-- Bottom Inset Console/Status Bar -->
  <g transform="translate(14, 114)">
    <rect x="0" y="0" width="252" height="30" fill="#ffffff" />
    <line x1="0" y1="0" x2="252" y2="0" stroke="#8a7673" stroke-width="1" />
    <line x1="0" y1="0" x2="0" y2="30" stroke="#8a7673" stroke-width="1" />
    <line x1="0" y1="29" x2="252" y2="29" stroke="#ffffff" stroke-width="0.8" />
    <line x1="251" y1="0" x2="251" y2="30" stroke="#ffffff" stroke-width="0.8" />
    <text x="10" y="19" font-family="'Courier New', Courier, monospace" font-size="9" font-weight="bold" fill="#ff758f">C:\TOOLS> dir /w</text>
  </g>
</svg>
